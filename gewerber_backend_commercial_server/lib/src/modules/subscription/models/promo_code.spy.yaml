class: PromoCode
table: commercial_promo_code
fields:
  code: String, unique
  kind: PromoCodeKind
  discountType: PromoDiscountType?
  discountPercent: int?
  discountMinor: int?
  trialDays: int?
  planId: int?
  maxRedemptions: int?
  perUserLimit: int, default=1
  validFrom: DateTime?
  validUntil: DateTime?
  campaign: String?
  ref: String?
  note: String?
  status: PromoCodeStatus, default=active
  paypalPlanVariantId: String?
  createdAt: DateTime, default=now
  updatedAt: DateTime, default=now
