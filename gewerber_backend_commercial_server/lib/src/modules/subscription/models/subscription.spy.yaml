class: Subscription
table: commercial_subscription
fields:
  userId: UuidValue
  businessId: int?
  planId: int, relation(parent=commercial_plan, onDelete=Restrict)
  status: SubscriptionStatus, default=trialing
  billingCycle: SubscriptionBillingCycle, default=monthly
  currentPeriodStart: DateTime, default=now
  currentPeriodEnd: DateTime, default=now
  trialEndsAt: DateTime?
  cancelAtPeriodEnd: bool, default=false
  canceledAt: DateTime?
  paypalSubscriptionId: String?
  paypalPayerId: String?
  appliedPromoCodeId: int?
  createdAt: DateTime, default=now
  updatedAt: DateTime, default=now
indexes:
  subscription_user_idx:
    fields: userId
  subscription_paypal_subscription_idx:
    fields: paypalSubscriptionId
