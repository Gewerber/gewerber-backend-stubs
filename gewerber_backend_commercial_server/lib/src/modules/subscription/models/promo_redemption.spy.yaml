class: PromoRedemption
table: commercial_promo_redemption
fields:
  promoCodeId: int
  userId: UuidValue
  businessId: int?
  appliedSubscriptionId: int?
  utmSource: String?
  utmMedium: String?
  utmCampaign: String?
  redeemedAt: DateTime, default=now
indexes:
  # Enforces one redemption per user per promo code (combined with
  # PromoCode.perUserLimit semantics at the application layer).
  promo_redemption_promo_user_unique_idx:
    fields: promoCodeId, userId
    unique: true
